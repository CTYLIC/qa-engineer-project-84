---
- summary: |
    Проверка отображения данных товара в каталоге
  environment: |
    Сайт: https://products-store.hexlet.app/, Google Chrome Version: 153.0.8018.53 (Official Build) (64-bit)
  steps-to-reproduce: |
    - Перейти на сайт https://products-store.hexlet.app/
    - Изучить карточки товаров на главной странице каталога
  expected-result: |
    В карточках товаров наглядно выводятся название, рейтинг, текущая цена со скидкой и старая перечеркнутая цена без скидки
  actual-result: |
    Рейтинг товара не отображается
    Скриншот дефекта:
    https://github.com/CTYLIC/qa-engineer-project-84/blob/main/screenshots/%D0%9A%D0%B0%D1%80%D1%82%D0%BE%D1%87%D0%BA%D0%B0%20%D1%82%D0%BE%D0%B2%D0%B0%D1%80%D0%B0%20%D0%B2%20%D0%BA%D0%B0%D1%82%D0%B0%D0%BB%D0%BE%D0%B3%D0%B5.png

- summary: |
    Проверка отображения графических элементов (иконок) в меню выбора языка
  environment: |
    Сайт: https://products-store.hexlet.app/, Google Chrome Version: 153.0.8018.53 (Official Build) (64-bit)
  steps-to-reproduce: |
    - Перейти на сайт https://products-store.hexlet.app/
    - Нажать на кнопку "Language" в шапке сайта для открытия выпадающего списка
  expected-result: |
    Рядом с названиями доступных языков ("English", "Russian", "Spanish") корректно отображаются графические иконки флагов
  actual-result: |
    Иконка флага в выпадающем меню выбора для английского языка отсутствует, на её месте пустая область

- summary: |
    Навигация в категорию через хэштег со страницы товара
  environment: |
    Сайт: https://products-store.hexlet.app/, Google Chrome Version: 153.0.8018.53 (Official Build) (64-bit)
  steps-to-reproduce: |
    - Открыть страницу товара Essence Mascara Lash Princess по ссылке https://hexlet.app
    - Найти кликабельный хэштег с названием категории под описанием товара
    - Кликнуть по нему или попытаться открыть его в новой вкладке браузера
  expected-result: |
    Клик по хэштегу перенаправляет пользователя в каталог товаров с применённым фильтром этой категории без перезагрузки интерфейса (в режиме SPA)
  actual-result: |
    Переход не происходит. Клик перезагружает текущую карточку товара (открывает ту же самую страницу), а при открытии в новой вкладке повторно дублируется страница этого же товара. Ссылка является неактивной заглушкой

- summary: |
    Проверка возможности сброса фильтра по категории (очистка фильтра)
  environment: |
    Сайт: https://products-store.hexlet.app/, Google Chrome Version: 153.0.8018.53 (Official Build) (64-bit)
  steps-to-reproduce: |
    - Открыть каталог товаров и раскрыть список "Категория"
    - Выбрать любую категорию (например, "beauty")
    - Попытаться отменить выбор в этом же блоке без перезагрузки сайта
  expected-result: |
    В интерфейсе выпадающего списка присутствует пустой пункт, крестик или кнопка "Все категории" для отмены фильтра
  actual-result: |
    Возможность сбросить выбранную категорию отсутствует, пользователь не может вернуть отображение полного списка товаров

- summary: |
    Добавление нескольких единиц одного и того же товара в корзину
  environment: |
    Сайт: https://products-store.hexlet.app/, Google Chrome Version: 153.0.8018.53 (Official Build) (64-bit), страница корзины
  steps-to-reproduce: |
    - Добавить один и тот же товар в корзину 3 раза подряд
    - Перейти на страницу корзины и изучить строку товара
  expected-result: |
    Базовая перечеркнутая цена динамически пересчитывается в соответствии с количеством товара в строке
  actual-result: |
    базовая перечеркнутая цена статично отображает стоимость только одной единицы товара, несмотря на увеличение количества

- summary: |
    Полная проверка русской локализации на основных разделах сайта
  environment: |
    Сайт: https://products-store.hexlet.app/, Google Chrome Version: 153.0.8018.53 (Official Build) (64-bit), блок фильтров
  steps-to-reproduce: |
    - Нажать на кнопку "Language" в шапке сайта и переключить локализацию на "Russian"
    - Открыть выпадающий список фильтра "Категория"
  expected-result: |
    Все названия категорий внутри раскрывающегося меню переводятся и отображаются на русском языке ("Красота", "Мебель" и т.д.)
  actual-result: |
    Заголовок перевелся ("Категория"), но названия элементов внутри списка (beauty, fragrances, furniture) остались на английском языке

- summary: |
    Переход к оформлению заказа из корзины и валидация страницы оплаты
  environment: |
    Сайт: https://products-store.hexlet.app/, Google Chrome Version: 153.0.8018.53 (Official Build) (64-bit), вкладка Console и Network
  steps-to-reproduce: |
    - Добавить любой товар в корзину и перейти в корзину по адресу https://hexlet.app
    - Открыть инструменты разработчика (DevTools) на вкладке Network или Console
    - Нажать на кнопку "Checkout"
    - Изучить ответ сервера на отправленный POST-запрос по адресу https://hexlet.app
  expected-result: |
    POST-запрос на создание заказа успешно обрабатывается сервером и возвращает статус 200/201. Фронтенд показывает модальное окно об успешном оформлении на основе успешного ответа бэкенда
  actual-result: |
    Сервер возвращает ошибку 500 (Internal Server Error), а во вкладке Console отображается сообщение "Failed to load resource". При этом интерфейс сайта (фронтенд) некорректно вводит пользователя в заблуждение, отображая плашку "Order placed successfully", несмотря на фактический сбой транзакции на бэкенде

- summary: |
    Закрытие/отмена окна заказа и возврат в приложение через крестик
  environment: |
    Сайт: https://products-store.hexlet.app/, Google Chrome Version: 153.0.8018.53 (Official Build) (64-bit)
  steps-to-reproduce: |
    - Инициировать оформление заказа и перейти к окну оплаты/формы заказа
    - Нажать на иконку крестика закрытия окна
  expected-result: |
    Окно успешно закрывается, происходит возврат в магазин, содержимое корзины полностью сохраняется до факта успешной оплаты
  actual-result: |
    При попытке закрыть модальное окно с помощью крестика, оно никуда не исчезает и продолжает блокировать интерфейс страницы

- summary: |
    Проверка корректности отображения текстовых меток в блоке фильтрации по производителю
  environment: |
    Сайт: https://products-store.hexlet.app/, Google Chrome Version: 153.0.8018.53 (Official Build) (64-bit), боковая панель
  steps-to-reproduce: |
    - Открыть главную страницу каталога товаров
    - Пролистать страницы
    - Обратить внимание на список производителей в блоке "Brand"
  expected-result: |
    Каждый чекбокс в списке брендов снабжен понятным текстовым названием (лейблом) производителя
  actual-result: |
    Некоторые чекбоксы в списке отображаются полностью пустыми, текстовое название бренда отсутствует

- summary: |
    Проверка кроссбраузерной совместимости и корректности отображения интерфейса в браузере Mozilla Firefox
  environment: |
    Сайт: https://products-store.hexlet.app/, Mozilla Firefox Версия 157.0.1 (64-разрядная)
  steps-to-reproduce: |
    - Открыть браузер Mozilla Firefox
    - Перейти на сайт по ссылке https://products-store.hexlet.app/
    - Визуально оценить расположение элементов сетки каталога товаров на главной странице
  expected-result: |
    Интерфейс и структура каталога отображаются корректно, блоки товаров и панель фильтров выровнены по сетке без сдвигов контента
  actual-result: |
    Верстка каталога полностью нарушена ("поплыла"), элементы наезжают друг на друга или смещаются со своих позиций по сравнению с отображением в Google Chrome

- summary: |
    Проверка перестроения интерфейса в мобильную версию (Нефункциональное)
  environment: |
    Сайт: https://products-store.hexlet.app/, Google Chrome Version: 153.0.8018.53 (Official Build) (64-bit), режим DevTools (эмуляция iPhone SE)
  steps-to-reproduce: |
    - Перейти на сайт https://products-store.hexlet.app/
    - Открыть инструменты разработчика в браузере (нажать F12)
    - Включить режим эмуляции мобильных устройств (Device Toolbar)
    - Выбрать устройство iPhone SE в выпадающем списке и изучить отображение страницы
  expected-result: |
    Интерфейс сайта полностью адаптировался под мобильный экран, элементы отображаются корректно
  actual-result: |
    Верстка элементов каталога нарушена, часть контента съехала
