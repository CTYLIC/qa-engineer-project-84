- summary: |
    Нарушение единообразия сетки из-за разной высоты блоков div.card-body карточек товаров
  environment: |
    Сайт: https://products-store.hexlet.app/, Google Chrome Version: 153.0.8018.53 (Official Build) (64-bit)
  steps-to-reproduce: |
    - Перейти на сайт https://products-store.hexlet.app/
    - Открыть инструменты разработчика (DevTools, вкладка Elements)
    - Поочередно навести инспектор элементов на блоки div.card-body у разных товаров в одном ряду (например, Eyeshadow Palette и Essence Mascara)
  expected-result: |
    Все карточки товаров и их внутренние контейнеры div.card-body в пределах одного ряда имеют одинаковую выровненную высоту
  actual-result: |
    Высота блоков div.card-body различается (например, 284.38px у одного товара и 260.38px у другого), из-за чего ломается единообразие сетки каталога
    Скриншот дефекта:https://github.com/CTYLIC/qa-engineer-project-84/blob/main/screenshots/%D0%9D%D0%B5%D0%BA%D0%BE%D1%80%D1%80%D0%B5%D0%BA%D1%82%D0%BD%D0%B0%D1%8F%20%D0%B2%D1%8B%D1%81%D0%BE%D1%82%D0%B0%20%D0%BA%D0%B0%D1%80%D1%82%D0%BE%D1%87%D0%B5%D0%BA%20%D0%BF%D1%80%D0%BE%D0%B4%D1%83%D0%BA%D1%82%D0%B0.png

- summary: |
    Исчезновение выбранной категории из выпадающего меню фильтров при переходе на следующую страницу каталога
  environment: |
    Сайт: https://products-store.hexlet.app/, Google Chrome Version: 153.0.8018.53 (Official Build) (64-bit)
  steps-to-reproduce:
    - Перейти на сайт https://products-store.hexlet.app/
    - Раскрыть выпадающий список "Category" и выбрать категорию "beauty"
    - Убедиться, что товары отфильтровались, и кликнуть на кнопку пагинации "Next" для перехода на страницу 2
    - Снова раскрыть выпадающий список "Category" в блоке фильтров
  expected-result: |
    Происходит переход на страницу 2 каталога. В выпадающем списке "Category" остаются доступными все глобальные категории сайта (включая "beauty"), а установленный фильтр не сбрасывается.
  actual-result: |
    При переходе на страницу 2 категория "beauty" полностью исчезает из выпадающего списка, а сам список заменяется другими категориями ("groceries", "home-decoration" и т.д.). Из-за этого выбранный фильтр ломается, и интерфейс отображает "Nothing found!".

- summary: |
    Ошибка округления итоговой суммы (Total) на 1 цент при расчёте стоимости корзины
  environment: |
    Сайт: https://products-store.hexlet.app/, Google Chrome Version: 153.0.8018.53 (Official Build) (64-bit)
  steps-to-reproduce: |
    - Перейти на сайт https://products-store.hexlet.app/
    - Нажать по одному разу кнопку "Add to cart" под товаром "Essence Mascara Lash Princess" и под товаром "Eyeshadow Palette with Mirror"
    - Перейти на страницу корзины через шапку сайта
    - Сравнить сумму стоимостей товаров в строках с итоговым значением в поле "Total"
  expected-result: |
    Финальные цены товаров в строках отображаются корректно, а значение в поле "Total" строго равно сумме этих цен (8.94$ + 16.35$ = 25.29$)
  actual-result: |
    Итоговая сумма рассчитывается с ошибкой округления: в поле "Total" отображается значение 25.30$ вместо 25.29$, из-за чего к стоимости заказа прибавляется лишний цент
    Скриншот дефекта:https://github.com/CTYLIC/qa-engineer-project-84/blob/main/screenshots/%D0%9E%D1%88%D0%B8%D0%B1%D0%BA%D0%B0%20%D0%BE%D0%BA%D1%80%D1%83%D0%B3%D0%BB%D0%B5%D0%BD%D0%B8%D1%8F%20%D0%B8%D1%82%D0%BE%D0%B3%D0%BE%D0%B2%D0%BE%D0%B9%20%D1%81%D1%83%D0%BC%D0%BC%D1%8B.png

- summary: |
    Отсутствие перехода на страницу оплаты при нажатии на кнопку "Checkout"
  environment: |
    Сайт: https://products-store.hexlet.app/, Google Chrome Version: 153.0.8018.53 (Official Build) (64-bit)
  steps-to-reproduce: |
    - Перейти на сайт https://products-store.hexlet.app/
    - Добавить любой товар в корзину и перейти на страницу корзины
    - Нажать на зеленую кнопку "Checkout"
  expected-result: |
    Приложение корректно перенаправляет пользователя на страницу оформления/оплаты заказа (или открывает соответствующую форму/модальное окно)
  actual-result: |
    При нажатии на кнопку "Checkout" переход на страницу оплаты не происходит, интерфейс корзины не меняется, и процесс оформления заказа блокируется
    Скриншот дефекта:https://github.com/CTYLIC/qa-engineer-project-84/blob/main/screenshots/%D0%9E%D1%82%D1%81%D1%83%D1%82%D1%81%D1%82%D0%B2%D0%B8%D0%B5%20%D0%BF%D0%B5%D1%80%D0%B5%D1%85%D0%BE%D0%B4%D0%B0%20%D0%BD%D0%B0%20%D1%81%D1%82%D1%80%D0%B0%D0%BD%D0%B8%D1%86%D1%83%20%D0%BE%D0%BF%D0%BB%D0%B0%D1%82%D1%8B%20%D0%BF%D0%BE%20%D0%BA%D0%BD%D0%BE%D0%BF%D0%BA%D0%B5%20Checkout.png
