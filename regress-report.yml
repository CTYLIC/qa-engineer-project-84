bugreports:
  - summary: |
      Проверка возможности сброса фильтра по категории (очистка фильтра)
    environment: |
      Сайт: https://products-store-v2.hexlet.app/, Google Chrome Version: 153.0.8018.53 (Official Build) (64-bit), боковая панель фильтрации
    steps-to-reproduce: |
      - Выбрать любую конкретную рабочую категорию в списке (например, "beauty")
      - Изменить состояние чекбокса "In Stock" (убедиться, что при включении кнопка "Next" появляется, а при выключении пропадает)
      - Выбрать пустое (дефолтное) поле в выпадающем списке категорий для очистки фильтра
      - Снова переключить чекбокс "In Stock" из состояния выключен во включен и прокрутить страницу вниз
    expected-result: |
      При выборе пустого значения фильтр категорий успешно сбрасывается. При последующем включении чекбокса "In Stock" внизу каталога должна стабильно появляться кнопка "Next" для переключения страниц
    actual-result: |
      Выбор пустого значения полностью ломает логику боковой панели. После очистки категории фильтрация по брендам и ценам перестает реагировать, а при включении чекбокса "In Stock" кнопка "Next" перестает появляться в интерфейсе вообще и больше не возвращается

  - summary: |
      Проверка навигации с помощью постраничного вывода
    environment: |
      Сайт: https://products-store-v2.hexlet.app/, Google Chrome Version: 153.0.8018.53 (Official Build) (64-bit), панель фильтров каталога
    steps-to-reproduce: |
      - Убедиться, что в блоке "Category" выбрана любая рабочая категория (или фильтр не трогался)
      - Выключить чекбокс "In Stock" на боковой панели фильтров
      - Попробовать переключить любой другой фильтр (бренд или ввести диапозон цены) и проверить наличие кнопки "Next"
    expected-result: |
      Все фильтры каталога работают независимо от состояния чекбокса наличия. При выключенном "In Stock" фильтрация по брендам и ценам должна успешно отрабатывать, а пагинация должна оставаться доступной
    actual-result: |
      Когда чекбокс "In Stock" выключен, полностью блокируется обработка всей боковой панели: ни один фильтр каталога (бренды, цены) не реагирует на действия пользователя, а кнопка пагинации "Next" полностью пропадает из интерфейса. Вся логика фильтрации и видимости кнопки "Next" активируется только после принудительного включения чекбокса "In Stock"

  - summary: |
      Негативная проверка поиска по несуществующему ключевому слову
    environment: |
      Сайт: https://products-store-v2.hexlet.app/, Google Chrome Version: 153.0.8018.53 (Official Build) (64-bit), строка поиска в шапке сайта
    steps-to-reproduce: |
      - Перейти на главную страницу каталога товаров
      - Ввести в поле поиска заведомо несуществующее слово или случайный набор символов (например, "qwerty12345") и инициировать поиск
      - Попробовать после этого применить любой фильтр на боковой панели (выбрать бренд, категорию или изменить диапазон цен)
    expected-result: |
      Каталог товаров полностью очищается от неподходящего контента и выводит текстовое сообщение "Товары не найдены". При этом боковая панель сохраняет работоспособность, позволяя пользователю изменять фильтры
    actual-result: |
      Поиск по несуществующему запросу игнорирует ввод и продолжает отображать полный перечень всех доступных товаров. Более того, после выполнения данного поиска намертво блокируется работа всей боковой панели: ни один фильтр (бренды, категории, цены) больше не реагирует на действия пользователя и не обновляет каталог

  - summary: |
      Полная очистка корзины (удаление всех товаров)
    environment: |
      Сайт: https://products-store-v2.hexlet.app/, Google Chrome Version: 153.0.8018.53 (Official Build) (64-bit), страница корзины
    steps-to-reproduce: |
      - Добавить несколько товаров в корзину и перейти в корзину
      - Нажать на кнопку "Clear Cart" и убедиться, что список товаров визуально очистился
      - Нажать на текстовую ссылку "Store" в верхнем меню сайта для возврата в каталог, после чего заново открыть корзину
    expected-result: |
      После нажатия кнопки "Clear Cart" состояние корзины безвозвратно очищается в памяти приложения. При переходе в каталог по любой ссылке или кнопке корзина обязана оставаться пустой
    actual-result: |
      Очистка корзины работает некорректно. После нажатия "Clear Cart" корзина очищается лишь визуально до момента навигации по сайту. При клике на ссылку "Store" в шапке и возврате в корзину все удаленные товары автоматически восстанавливаются
