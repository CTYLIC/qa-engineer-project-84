bugreports:
  - summary: |
      Нарушение отображения интерфейса каталога в мобильной версии (эмуляция iPhone SE)
    environment: |
      Сайт: https://hexlet.app, Google chrome Version: 153.0.8010.53 (Official Build) (64-bit), режим DevTools (эмуляция iPhone SE)
    steps-to-reproduce: |
      1. Перейти на сайт https://hexlet.app
      2. Открыть инструменты разработчика в браузере (нажать F12)
      3. Включить режим эмуляции мобильных устройств (Device Toolbar)
      4. Выбрать устройство iPhone SE в выпадающем списке и изучить отображение страницы
    expected-result: |
      Интерфейс сайта полностью адаптировался под мобильный экран, элементы отображаются корректно
    actual-result: |
      Верстка элементов каталога нарушена, часть контента съехала
