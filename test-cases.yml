---
- summary: |
    Проверка отображения данных товара в каталоге
  requirement: |
    На странице товара и в каталоге должны выводиться название, рейтинг, цена со скидкой и без неё
  prerequisites: |
    Открыт сайт https://products-store.hexlet.app/
  test-data: |
    Целевой товар = Essence Mascara Lash Princess
  steps:
    - Открыть главную страницу каталога товаров
    - Найти в списке карточку целевого товара
  expected-result: |
    В карточке товара в каталоге корректно отображаются: название, рейтинг, текущая цена со скидкой и перечеркнутая старая цена без скидки

- summary: |
    Проверка отображения графических элементов (иконок) в меню выбора языка
  requirement: |
    Сайт должен иметь локализацию (перевод) на русский и английский языки и поддерживать переключение интерфейса
  prerequisites: |
    Открыт сайт https://hexlet.app
  test-data: |
    Целевой элемент = Меню "Language", Язык = English
  steps:
    - Кликнуть на кнопку выбора языка "Language" в шапке сайта для открытия выпадающего списка
    - Визуально проверить отображение графических элементов (картинок) рядом с названиями доступных языков
    - Открыть инструменты разработчика (DevTools, вкладка Console), чтобы проверить наличие ошибок загрузки ресурсов
  expected-result: |
    Все графические иконки (картинки) в выпадающем меню отображаются корректно. В DevTools (вкладка Console) отсутствуют ошибки загрузки

- summary: |
    Проверка отображения подробной информации на странице конкретного товара
  requirement: |
    Пользователь должен иметь возможность просматривать товары и просматривать подробную информацию о товаре
  prerequisites: |
    Открыт сайт https://products-store.hexlet.app/
  test-data: |
    Целевой товар = Essence Mascara Lash Princess
  steps:
    - Найти целевой товар в каталоге и кликнуть на его название или изображение
  expected-result: |
    Открывается отдельная страница товара. На ней в полном объеме отображаются: название, подробное текстовое описание, рейтинг, актуальная цена со скидкой и базовая цена без скидки

- summary: |
    Навигация в категорию через хэштег со страницы товара
  requirement: |
    Пользователь должен иметь возможность искать товары по ключевому слову или категории
  prerequisites: |
    Открыта страница конкретного товара на сайте https://products-store.hexlet.app/products/1
  test-data: |
    Целевой товар = Essence Mascara Lash Princess
  steps:
    - Кликнуть на хэштег
  expected-result: |
    Происходит мгновенный переход (без перезагрузки страницы в режиме SPA) обратно в каталог. Автоматически активируется фильтр по данной категории, и в списке отображаются только товары из неё

- summary: |
    Фильтрация товаров по отдельной категории
  requirement: |
    Пользователь должен иметь возможность фильтровать товары в каталоге
  prerequisites: |
    Открыт сайт https://products-store.hexlet.app/
  test-data: |
    Категория = beauty
  steps:
    - Выбрать категорию из test-data в боковом блоке фильтров категорий
  expected-result: |
    На странице мгновенно отображается список товаров, который строго соответствует выбранной категории beauty. Товары из других категорий скрыты

- summary: |
    Проверка возможности сброса фильтра по категории (очистка фильтра)
  requirement: |
    Пользователь должен иметь возможность фильтровать товары в каталоге и сбрасывать выбранные фильтры
  prerequisites: |
    Открыт сайт https://products-store.hexlet.app/
  test-data: |
    Категория = beauty
  steps:
    - Выбрать категорию из test-data в боковом блоке фильтров категорий
    - Попытаться найти кнопку "Все категории", "Сбросить" или пустой элемент для отмены фильтрации в этом же блоке
  expected-result: |
    В блоке фильтрации присутствует явный графический элемент (кнопка сброса, крестик или пункт "All Categories") для отмены фильтра. При клике на него фильтр сбрасывается, и в каталоге снова отображаются товары из всех категорий

- summary: |
    Фильтрация товаров по производителю (бренду)
  requirement: |
    Пользователь должен иметь возможность фильтровать товары в каталоге
  prerequisites: |
    Открыт сайт https://products-store.hexlet.app/
  test-data: |
    Бренд = Essence
  steps:
    - Найти блок фильтрации «Brand» и выбрать бренд из test-data
  expected-result: |
    Список товаров в каталоге обновляется и выводит только позиции, произведенные брендом Essence

- summary: |
    Фильтрация товаров по диапазону цен
  requirement: |
    Пользователь должен иметь возможность фильтровать товары в каталоге
  prerequisites: |
    Открыт сайт https://products-store.hexlet.app/
  test-data: |
    Минимальная цена = 10, Максимальная цена = 50
  steps:
    - В блоке фильтрации по цене выставить значения цен из test-data
  expected-result: |
    В каталоге отображаются только те товары, актуальная цена которых находится в диапазоне от 10 до 50 включительно

- summary: |
    Фильтрация товаров по наличию на складе
  requirement: |
    Пользователь должен иметь возможность фильтровать товары в каталоге
  prerequisites: |
    Открыт сайт https://products-store.hexlet.app/
  test-data: |
    Статус наличия = In Stock (В наличии)
  steps:
    - В блоке фильтрации активировать чекбокс/переключатель статуса из test-data
  expected-result: |
    В списке каталога отображаются только доступные для покупки товары

- summary: |
    Комплексная фильтрация товаров по нескольким параметрам
  requirement: |
    При одновременном применении фильтров система должна выводить список товаров, соответствующих всем условиям
  prerequisites: |
    Открыт сайт https://products-store.hexlet.app/
  test-data: |
    Категория = beauty, Бренд = Essence, Поисковый запрос = Mascara
  steps:
    - Выбрать категорию из test-data в блоке фильтров
    - Выбрать фильтр бренда из test-data в блоке Brand
    - В поле поиска ввести значение из test-data
  expected-result: |
    На странице отображается список товаров, который строго соответствует категории beauty, бренду Essence и содержит в названии слово Mascara

- summary: |
    Поиск товаров по ключевому слову
  requirement: |
    Пользователь должен иметь возможность искать товары по ключевому слову или категории
  prerequisites: |
    Открыт сайт https://products-store.hexlet.app/
  test-data: |
    Поисковый запрос = Mascara
  steps:
    - Открыть каталог товаров
    - Ввести в поле поиска значение из test-data
  expected-result: |
    В списке товаров выводятся только те позиции, в названии или описании которых содержится слово Mascara

- summary: |
    Негативная проверка поиска по несуществующему ключевому слову
  requirement: |
    Пользователь должен иметь возможность искать товары по ключевому слову или категории
  prerequisites: |
    Открыт сайт https://products-store.hexlet.app/
  test-data: |
    Поисковый запрос = Несуществующий товар
  steps:
    - Открыть каталог товаров
    - Ввести в поле поиска значение из test-data
  expected-result: |
    Каталог товаров пуст. На экране отображается понятное пользователю сообщение (например, "Товары не найдены" / "No products found"). Интерфейс сайта не ломается

- summary: |
    Проверка навигации с помощью постраничного вывода
  requirement: |
    Пользователь должен иметь возможность пользоваться постраничным выводом при просмотре каталога
  prerequisites: |
    Открыт сайт https://products-store.hexlet.app/
  test-data: |
    Номер страницы = 2
  steps:
    - Открыть каталог товаров
    - Кликнуть на кнопку "Next"
  expected-result: |
    Происходит переход на вторую страницу каталога без перезагрузки вкладки (SPA). Набор товаров меняется на следующий пул позиций

- summary: |
    Успешное добавление товара в корзину
  requirement: |
    При нажатии кнопки "Add to cart" товар должен добавиться в корзину
  prerequisites: |
    Открыт сайт https://products-store.hexlet.app/
  test-data: |
    Целевой товар = Essence Mascara Lash Princess
  steps:
    - Нажать кнопку "Add to cart" под целевым товаром
  expected-result: |
    В интерфейсе счетчик корзины в шапке сайта увеличивается на 1

- summary: |
    Просмотр содержимого корзины
  requirement: |
    При нажатии на кнопку "Cart" товар должен отображаться в корзине
  prerequisites: |
    Открыт сайт https://products-store.hexlet.app/, в корзину предварительно добавлен минимум один товар.
  test-data: |
    Ожидаемый товар в корзине = Essence Mascara Lash Princess
  steps:
    - Кликнуть на кнопку "Cart" в шапке сайта
  expected-result: |
    Происходит переход на страницу корзины без перезагрузки вкладки (в режиме SPA). В списке добавленных товаров корректно отображается выбранная позиция из test-data с указанием ее количества и стоимости

- summary: |
    Добавление нескольких единиц одного и того же товара в корзину
  requirement: |
    Пользователь должен иметь возможность добавлять товары в корзину и просматривать содержимое корзины
  prerequisites: |
    Открыт сайт https://products-store.hexlet.app/
  test-data: |
    Целевой товар = Essence Mascara Lash Princess, Количество = 3
  steps:
    - Нажать кнопку "Add to cart" под целевым товаром три раза подряд
    - Перейти на страницу корзины
  expected-result: |
    В корзине отображается одна строка с целевым товаром. В столбце количества указано значение "3". Общая стоимость позиции корректно пересчитана

- summary: |
    Добавление нескольких разных товаров в корзину
  requirement: |
    Пользователь должен иметь возможность добавлять товары в корзину и просматривать содержимое корзины
  prerequisites: |
    Открыт сайт https://products-store.hexlet.app/
  test-data: |
    Товар 1 = Essence Mascara Lash Princess, Товар 2 = Eyeshadow Palette With Mirror
  steps:
    - Нажать кнопку "Add to cart" под Товаром 1 и под Товаром 2
    - Перейти на страницу корзины через шапку сайта
  expected-result: |
    На странице корзины отображаются две отдельные строки - по одной для каждого выбранного товара. Цены товаров и их финальная стоимость в строках отображаются корректно и соответствуют ценам в каталоге со всеми скидками

- summary: |
    Подсчёт всей стоимости корзины
  requirement: |
    Пользователь должен иметь возможность посмотреть стоимость всех товаров в корзине
  prerequisites: |
    Открыт сайт https://products-store.hexlet.app/
  test-data: |
    Товар 1 = Essence Mascara Lash Princess, Товар 2 = Eyeshadow Palette With Mirror
  steps:
    - Найти в каталоге Товар 1 и нажать "Add to cart"
    - Найти в каталоге Товар 2 и нажать "Add to cart"
    - Перейти на страницу корзины через шапку сайта
  expected-result: |
    На странице, рядом с подписью "total" корректно отображается цена всех товаров в корзине

- summary: |
    Успешное удаление товара из корзины
  requirement: |
    Пользователь должен иметь возможность удалить товар из корзины
  prerequisites: |
    Открыт сайт https://products-store.hexlet.app/, в корзину добавлен минимум один товар, открыта страница корзины.
  test-data: |
    Товар в корзине = Essence Mascara Lash Princess
  steps:
    - Найти добавленный товар на странице корзины
    - Нажать кнопку удаления товара "Delete"
  expected-result: |
    Товар мгновенно исчезает из списка корзины, итоговая сумма заказа пересчитывается

- summary: |
    Полная очистка корзины (удаление всех товаров)
  requirement: |
    Пользователь должен иметь возможность удалить товар из корзины
  prerequisites: |
    Открыт сайт https://products-store.hexlet.app/, в корзину добавлено несколько разных товаров, открыта страница корзины
  test-data: |
    Товары в корзине = Essence Mascara Lash Princess, Eyeshadow Palette With Mirror
  steps:
    - Нажать кнопку "Clear Cart"
  expected-result: |
    Все товары удалены из списка корзины. На экране отображается состояние пустой корзины с соответствующим текстом, итоговая сумма равна 0

- summary: |
    Возврат к покупкам из интерфейса корзины
  requirement: |
    На странице корзины пользователь сможет продолжить выбирать товары в каталоге
  prerequisites: |
    Открыта страница корзины на сайте https://products-store.hexlet.app/
  test-data: |
    Действие = Клик по кнопке "Continue Shopping"
  steps:
    - Найти на странице корзины ссылку или кнопку "Continue Shopping" (Продолжить покупки) и кликнуть на неё
  expected-result: |
    Происходит мгновенный возврат на страницу каталога товаров в режиме SPA (без перезагрузки вкладки браузера). Состояние ранее добавленных товаров в корзине успешно сохраняется

- summary: |
    Переход к оформлению заказа из корзины и валидация страницы оплаты
  requirement: |
    Пользователь должен иметь возможность оформить заказ из корзины с переходом на страницу оплаты
  prerequisites: |
    Открыт сайт https://products-store.hexlet.app/, в корзину добавлен товар, открыта страница корзины
  test-data: |
    Действие = Клик по Checkout
  steps:
    - Открыть инструменты разработчика (DevTools -> вкладки Console и Network)
    - Нажать на кнопку "Checkout" на странице корзины
    - Проверить, открылась ли страница оплаты
  expected-result: |
    Происходит успешный переход из корзины на защищенный интерфейс страницы оплаты. В DevTools отсутствуют ошибки выполнения скриптов и сетевые сбои

- summary: |
    Закрытие/отмена окна заказа и возврат в приложение через крестик
  requirement: |
    Пользователь должен иметь возможность оформить заказ из корзины с переходом на страницу оплаты
  prerequisites: |
    Пользователь нажал кнопку оформления заказа и находится на этапе оформления оплаты (или в модальном окне заказа) на сайте https://products-store.hexlet.app/
  test-data: |
    Действие = Клик по крестику
  steps:
    - Нажать на кнопку отмены, закрытия (крестик)
  expected-result: |
    Окно заказа успешно закрывается (или происходит возврат назад). Пользователь возвращается в интерфейс магазина, при этом корзина не очищается автоматически

- summary: |
    Закрытие/отмена окна заказа и возврат в приложение через кнопку "Close"
  requirement: |
    Пользователь должен иметь возможность оформить заказ из корзины с переходом на страницу оплаты
  prerequisites: |
    Пользователь нажал кнопку оформления заказа и находится на этапе оформления оплаты (или в модальном окне заказа) на сайте https://products-store.hexlet.app/
  test-data: |
    Действие = Клик по кнопке "Close"
  steps:
    - Нажать на кнопку отмены, "Close"
  expected-result: |
    Окно заказа успешно закрывается (или происходит возврат назад). Пользователь возвращается в интерфейс магазина, при этом корзина не очищается автоматически

- summary: |
    Полная проверка русской локализации на основных разделах сайта
  requirement: |
    Сайт должен иметь локализацию (перевод) на русский и английский языки и поддерживать переключение интерфейса
  prerequisites: |
    Открыт сайт https://products-store.hexlet.app/
  test-data: |
    Язык интерфейса = Russian, Товар = Essence Mascara Lash Princess
  steps:
    - Кликнуть на кнопку "Language" в шапке сайта и выбрать "Russian"
    - Проверить перевод элементов интерфейса в каталоге и блоке фильтров
    - Выставить любой фильтр в боковой панели
    - Открыть карточку целевого товара
    - Нажать «Добавить в корзину» и перейти в корзину через шапку сайта
    - Нажать «Оформить заказ» для перехода на экран оплаты
  expected-result: |
    На каждом шаге (каталог, фильтры, страница товара, корзина, кнопка оформления) весь интерфейс, системные сообщения и кнопки переведены и корректно отображаются на русском языке

- summary: |
    Полная проверка английской локализации на основных разделах сайта
  requirement: |
    Сайт должен иметь локализацию (перевод) на русский и английский языки и поддерживать переключение интерфейса
  prerequisites: |
    Открыт сайт https://products-store.hexlet.app/
  test-data: |
    Язык интерфейса = English, Товар = Essence Mascara Lash Princess
  steps:
    - Кликнуть на кнопку "Language" в шапке сайта и выбрать "English" (или убедиться, что он активен по умолчанию)
    - Проверить текст элементов интерфейса в каталоге и блоке фильтров
    - Выставить любой фильтр в боковой панели
    - Открыть карточку целевого товара
    - Нажать «Add to cart» и перейти в корзину (Cart) через шапку сайта
    - Нажать «Checkout» для перехода на экран оплаты
  expected-result: |
    На каждом этапе пути пользователя все кнопки, заголовки, названия фильтров и элементов корзины отображаются на английском языке

- summary: |
    Проверка стабильности сетевых запросов при переключении страниц каталога через DevTools
  requirement: |
    Пользователь должен иметь возможность пользоваться постраничным выводом при просмотре каталога
  prerequisites: |
    Открыт сайт https://products-store.hexlet.app/, открыты инструменты разработчика (DevTools, вкладка Network)
  test-data: |
    Номер страницы = 3
  steps:
    - Очистить логи во вкладке Network в DevTools
    - Кликнуть на кнопку "Next" 2 раза
    - Изучить отправленный API-запрос на получение новой порции данных товаров
