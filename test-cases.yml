---
- summary: |
    Комплексная фильтрация товаров по категории, бренду и ключевому слову
  requirement: |
    При одновременном применении фильтров по категории, бренду и поисковому запросу система должна мгновенно выводить список товаров, строго соответствующих всем трем условиям
  prerequisites: |
    Открыт сайт https://products-store.hexlet.app/
  test-data: |
    Категория = beauty
    Фильтр бренда = Essence
    Поисковый запрос = Mascara
  steps:
    - Выбрать категорию из test-data в блоке фильтров
    - Выбрать фильтр бренда из test-data в блоке Brand
    - В поле поиска ввести значение из test-data
  expected-result: |
    На странице мгновенно отображается список товаров, который строго соответствует категории beauty, бренду Essence и содержит в названии слово Mascara

- summary: |
    Проверка перестроения интерфейса в мобильную версию
  requirement: |
    Сайт должен иметь мобильную версию
  prerequisites: |
    Открыт сайт https://products-store.hexlet.app/
  test-data: |
    Устройство для эмуляции = iPhone SE
  steps:
    - Открыть инструменты разработчика в браузере
    - Включить режим эмуляции мобильных устройств и выставить устройство для эмуляции из test-data
  expected-result: |
    Интерфейс сайта адаптировался под мобильный экран: элементы каталога перестроились, появилось мобильное меню, верстка отображается корректно

- summary: |
    Успешный просмотр списка товаров и подробной информации о конкретном товаре
  requirement: |
    При открытии каталога пользователю должен отображаться список товаров, а при клике на товар должна открываться страница с его подробной информацией
  prerequisites: |
    Открыт сайт https://products-store.hexlet.app/
  test-data: |
    Целевой товар = Essence Mascara Lash Princess
  steps:
    - Проверить отображение целевого товара в списке каталога
    - Кликнуть на название или изображение целевого товара
  expected-result: |
    Открывается отдельная страница товара, где отображается его подробная информация (название, описание, рейтинг, цена и скидка)

- summary: |
    Успешное добавление товара в корзину и просмотр содержимого корзины
  requirement: |
    При нажатии кнопки "Add to cart" товар должен добавиться в корзину, а при нажатии на кнопку "Cart" — отображаться в корзине
  prerequisites: |
    Открыт сайт https://products-store.hexlet.app/
  test-data: |
    Целевой товар = Essence Mascara Lash Princess
  steps:
    - Нажать кнопку "Add to cart" под товаром из test-data
    - Кликнуть на кнопку "Cart"
  expected-result: |
    Открывается страница корзины, в списке товаров отображается добавленный товар из test-data

- summary: |
    Проверка локализации сайта на русский и английский языки
  requirement: |
    Сайт должен иметь локализацию (перевод) на русский и английский языки и поддерживать переключение интерфейса
  prerequisites: |
    Открыт сайт https://products-store.hexlet.app/
  test-data: |
    Язык интерфейса = русский, английский
  steps:
    - Проверить, что по умолчанию элементы интерфейса отображаются на английском языке
    - Кликнуть на кнопку "Language" в шапке сайта
    - Нажать на "Russian"
  expected-result: |
    Интерфейс сайта успешно переводится на русский язык, названия категорий и кнопок отображаются на русском
